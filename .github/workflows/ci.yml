name: CI

on:
  push:
    branches: [main, QualisiteV2]
  pull_request:
    branches: [main, QualisiteV2]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/qualisite
          PORT: 3001
          NODE_ENV: test
          ALLOWED_ORIGINS: http://localhost:5173
        run: npm test