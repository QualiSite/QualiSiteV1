name: CI

on:
  push:
    branches: [main, QualisiteV2]
  pull_request:
    branches: [main, QualisiteV2]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Type check
        working-directory: backend
        run: npm run build

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/qualisite
          PORT: 3001
          NODE_ENV: test
          ALLOWED_ORIGINS: http://localhost:5173
          JWT_SECRET: test_secret_for_ci_only_not_used_in_prod
          JWT_ACCESS_EXPIRES_IN: 900
          JWT_REFRESH_EXPIRES_IN: 604800
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_EMAIL: test@example.com
          UPLOAD_URL: http://localhost:3001/uploads
        run: npm run test:coverage

  test-frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  security-audit:
    name: Dependency Audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=critical

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=critical