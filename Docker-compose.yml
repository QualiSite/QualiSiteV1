services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /mnt/storage/uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/qualisite
      - JWT_SECRET=dev_secret_change_in_prod
      - PORT=3001
      - UPLOAD_URL=https://qualinaturelle.fr/uploads
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=qualisite
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: