services:

  # ── Développement ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3001
    image: qualisite-frontend:dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - INTERNAL_API_URL=http://backend:3001
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    depends_on:
      - backend
    profiles: ["dev"]
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules
            - .next

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    image: qualisite-backend:dev
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/qualisite
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - db
    profiles: ["dev"]
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - node_modules
            - uploads

  # ── Production ────────────────────────────────────
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        - NEXT_PUBLIC_API_URL=
        - INTERNAL_API_URL=http://backend-prod:3001
    image: qualisite-frontend:latest
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=
      - INTERNAL_API_URL=http://backend-prod:3001
      - HOSTNAME=0.0.0.0
      - PORT=3000
    depends_on:
      - backend-prod
    profiles: ["prod"]
    restart: unless-stopped

  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: qualisite-backend:latest
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/qualisite
      - ALLOWED_ORIGINS=https://qualisite.alithiel31.dev
    depends_on:
      - db
    profiles: ["prod"]
    restart: unless-stopped

  # ── Base de données (commune) ──────────────────────
  db:
    image: postgres:16-alpine
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=qualisite
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: